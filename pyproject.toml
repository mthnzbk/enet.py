[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpl-enet"
version = "2.7.2"
description = "Modern Python bindings for zpl-c/enet reliable UDP networking library"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Metehan Özbek", email = "mthnzbk@gmail.com" }
]
keywords = [
    "enet",
    "networking",
    "udp",
    "reliable-udp",
    "game-networking",
    "multiplayer",
    "sockets",
    "zpl"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/mthnzbk/enet.py"
Repository = "https://github.com/mthnzbk/enet.py"
"Bug Tracker" = "https://github.com/mthnzbk/enet.py/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["enet*"]

[tool.setuptools.package-data]
enet = ["lib/*", "py.typed"]
